# ════════════════════════════════════════════════════════════════════════════
# RPW BOOSTER — Render Blueprint (render.yaml)
#
# HOW TO DEPLOY (fully automatic, no manual input):
#   1. Go to https://dashboard.render.com
#   2. Click New → Blueprint
#   3. Connect repo: lgnd226/RPW-BOOSTERS
#   4. Click "Apply" — Render auto-creates DB + service + all env vars
#   5. Wait ~5 min for Docker build → live at rpw-booster-api.onrender.com
# ════════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: rpw-booster-api
    env: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rpw-booster-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Render auto-sets RENDER_EXTERNAL_URL — keep-alive uses it to self-ping

databases:
  - name: rpw-booster-db
    databaseName: rpwbooster
    plan: free
    region: singapore
