# ════════════════════════════════════════════════════════════════════════════
# RPW BOOSTER — Render Blueprint
#
# DEPLOY (zero manual input):
#   1. https://dashboard.render.com → New → Blueprint
#   2. Connect: lgnd226/RPW-BOOSTERS  → Apply
#   Render auto-creates: PostgreSQL DB + Node service + all env vars
# ════════════════════════════════════════════════════════════════════════════

databases:
  - name: rpw-booster-db
    databaseName: rpwbooster
    plan: free
    region: singapore

services:
  - type: web
    name: rpw-booster-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rpw-booster-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
